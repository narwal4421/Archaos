version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: archaos-postgres
    environment:
      POSTGRES_USER: archaos_user
      POSTGRES_PASSWORD: archaos_password
      POSTGRES_DB: archaos_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - archaos-network

  redis:
    image: redis:7-alpine
    container_name: archaos-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - archaos-network

volumes:
  postgres_data:
  redis_data:

networks:
  archaos-network:
    driver: bridge
